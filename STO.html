<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Парадокс близнецов — интерактивная анимация</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #070b12;
    color: #e8eef7;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .container { width: 100%; max-width: 880px; }
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1 {
    font-size: 1.4rem;
    font-weight: 600;
    margin: 0 0 6px;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: #7a8ba3;
    font-size: 0.88rem;
    margin: 0 0 18px;
    line-height: 1.5;
  }
  .lang-switch{display:flex;gap:4px;flex-shrink:0}
  .lang-btn{
    appearance:none;background:#0e1522;color:#7a8ba3;border:1px solid #1e2a3f;
    font:inherit;font-family:ui-monospace,monospace;font-size:12px;font-weight:650;
    letter-spacing:.08em;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.15s;
  }
  .lang-btn:hover{background:#1a2436;color:#cfe0f5;border-color:#2a3a52}
  .lang-btn.active{background:#2563eb;border-color:#2563eb;color:#fff}
  .canvas-wrap {
    border-radius: 16px;
    overflow: hidden;
    background: #050810;
    border: 1px solid #1a2436;
    box-shadow: 0 8px 32px rgba(0,0,0,0.45);
  }
  canvas { display: block; width: 100%; height: 340px; }

  .clocks {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
  }
  .clock {
    background: #0e1522;
    border: 1px solid #1e2a3f;
    border-radius: 12px;
    padding: 13px 16px;
  }
  .clock.rocket { border-color: #24406e; }
  .clock .label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #7a8ba3;
    margin-bottom: 5px;
  }
  .clock .time {
    font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
    font-size: 1.55rem;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .clock.earth .time { color: #6ee7b7; }
  .clock.rocket .time { color: #60a5fa; }
  .clock .sub {
    font-size: 0.75rem;
    color: #6b7c94;
    margin-top: 4px;
  }

  .controls {
    margin-top: 16px;
    background: #0e1522;
    border: 1px solid #1e2a3f;
    border-radius: 14px;
    padding: 16px 18px;
  }
  .control-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .control-row label { font-size: 0.88rem; color: #a8b8ce; }
  .control-row .value {
    font-family: ui-monospace, monospace;
    font-size: 1.05rem;
    font-weight: 600;
    color: #60a5fa;
  }
  input[type="range"] {
    width: 100%;
    accent-color: #3b82f6;
    cursor: pointer;
    height: 22px;
  }
  input[type="range"]:disabled { opacity: 0.35; cursor: not-allowed; }
  .formula {
    margin-top: 10px;
    font-size: 0.82rem;
    color: #6b7c94;
    font-family: ui-monospace, monospace;
    text-align: center;
  }
  .buttons {
    display: flex;
    gap: 10px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    background: #1a2436;
    color: #e8eef7;
    border: 1px solid #2a3a52;
    border-radius: 10px;
    padding: 11px 16px;
    font-size: 0.92rem;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s, border-color 0.15s, opacity 0.15s;
  }
  button:hover:not(:disabled) { background: #24344a; border-color: #3a5070; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button.primary { background: #2563eb; border-color: #2563eb; }
  button.primary:hover:not(:disabled) { background: #3b82f6; border-color: #3b82f6; }
  button.primary:disabled { background: #1e3a70; border-color: #1e3a70; }

  .result {
    text-align: center;
    margin-top: 14px;
    font-size: 0.92rem;
    color: #6ee7b7;
    min-height: 1.4em;
    opacity: 0;
    transition: opacity 0.5s;
    padding: 0 8px;
    line-height: 1.4;
  }
  .result.show { opacity: 1; }

  @media (max-width: 600px) {
    canvas { height: 260px; }
    .clocks { grid-template-columns: 1fr; }
    .clock .time { font-size: 1.3rem; }
    .buttons { flex-wrap: wrap; }
    button { flex: 1 1 40%; }
  }
</style>
</head>
<body>
  <div class="container">

    <div class="page-head">
      <div>
        <h1 data-i18n="h1">Парадокс близнецов</h1>
        <p class="subtitle" data-i18n="subtitle">
          Ракета летит к точке на расстоянии 4 световых года и возвращается.
          Скорость близка к скорости света. Сравните показания часов на Земле и на ракете.
        </p>
      </div>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="ru">RU</button>
        <button class="lang-btn" data-lang="en">EN</button>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="scene"></canvas>
    </div>

    <div class="clocks">
      <div class="clock earth">
        <div class="label" data-i18n="earth">Земля</div>
        <div class="time" id="earthTime">0.00 лет</div>
        <div class="sub" data-i18n="coordTime">координатное время</div>
      </div>
      <div class="clock rocket">
        <div class="label" data-i18n="rocket">Ракета</div>
        <div class="time" id="rocketTime">0.00 лет</div>
        <div class="sub" data-i18n="properTime">собственное время</div>
      </div>
    </div>

    <div class="result" id="result"></div>

    <div class="controls">
      <div class="control-row">
        <label for="speed" data-i18n="speedLbl">Скорость ракеты</label>
        <span class="value" id="vLabel">0.80 c</span>
      </div>
      <input type="range" id="speed" min="0.5" max="0.99" step="0.01" value="0.8">
      <div class="formula">
        γ = <span id="gamma">1.667</span> &nbsp;·&nbsp; Δτ = Δt / γ
      </div>
      <div class="buttons">
        <button id="startBtn" class="primary" data-i18n="start">Старт</button>
        <button id="turnBtn" disabled data-i18n="turn">Развернуть</button>
        <button id="resetBtn" data-i18n="reset">Сброс</button>
      </div>
    </div>
  </div>

<script>
(() => {
  'use strict';

  /* ══════════════════════════════════════════════════════════
     I18N
     ══════════════════════════════════════════════════════════ */
  const I18N = {
    ru: {
      docTitle: 'Парадокс близнецов — интерактивная анимация',
      h1: 'Парадокс близнецов',
      subtitle: 'Ракета летит к точке на расстоянии 4 световых года и возвращается. Скорость близка к скорости света. Сравните показания часов на Земле и на ракете.',
      earth: 'Земля',
      rocket: 'Ракета',
      coordTime: 'координатное время',
      properTime: 'собственное время',
      speedLbl: 'Скорость ракеты',
      start: 'Старт',
      pause: 'Пауза',
      resume: 'Продолжить',
      done: 'Готово',
      turn: 'Развернуть',
      reset: 'Сброс',
      unitsYears: 'лет',
      canvasEarth: 'Земля',
      canvasDest: '4 св. года',
      resultMsg: (diff) => 'На ракете прошло на ' + diff.toFixed(2) + ' лет меньше, чем на Земле'
    },
    en: {
      docTitle: 'Twin Paradox — interactive animation',
      h1: 'Twin Paradox',
      subtitle: 'A rocket flies to a point 4 light-years away and returns. The speed is close to the speed of light. Compare the clocks on Earth and on the rocket.',
      earth: 'Earth',
      rocket: 'Rocket',
      coordTime: 'coordinate time',
      properTime: 'proper time',
      speedLbl: 'Rocket speed',
      start: 'Start',
      pause: 'Pause',
      resume: 'Resume',
      done: 'Done',
      turn: 'Turn around',
      reset: 'Reset',
      unitsYears: 'years',
      canvasEarth: 'Earth',
      canvasDest: '4 light-years',
      resultMsg: (diff) => diff.toFixed(2) + ' years less passed on the rocket than on Earth'
    }
  };

  let currentLang = 'ru';
  (function initLang(){
    let urlLang = null;
    try { urlLang = new URLSearchParams(location.search).get('lang'); } catch(e){}
    const stored = localStorage.getItem('lang');
    const candidate = (urlLang || stored || 'ru').toLowerCase();
    currentLang = I18N[candidate] ? candidate : 'ru';
  })();

  function applyLang(lang){
    if (!I18N[lang]) lang = 'ru';
    currentLang = lang;
    const d = I18N[lang];
    document.documentElement.lang = lang;
    document.title = d.docTitle;

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.dataset.i18n;
      if (d[k] != null) el.textContent = d[k];
    });
    document.querySelectorAll('.lang-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });

    updateUI();
    updateButtons();
    if (state.finished) onFinish();
    try { localStorage.setItem('lang', lang); } catch(e){}
  }

  document.querySelectorAll('.lang-btn').forEach(b => {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  });

  window.addEventListener('storage', e => {
    if (e.key === 'lang' && e.newValue && I18N[e.newValue] && e.newValue !== currentLang) {
      applyLang(e.newValue);
    }
  });

  /* ══════════════════════════════════════════════════════════
     ОРИГИНАЛЬНАЯ ЛОГИКА
     ══════════════════════════════════════════════════════════ */
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');

  const earthTimeEl = document.getElementById('earthTime');
  const rocketTimeEl = document.getElementById('rocketTime');
  const gammaEl = document.getElementById('gamma');
  const speedInput = document.getElementById('speed');
  const vLabel = document.getElementById('vLabel');
  const startBtn = document.getElementById('startBtn');
  const turnBtn = document.getElementById('turnBtn');
  const resetBtn = document.getElementById('resetBtn');
  const resultEl = document.getElementById('result');

  const D = 4;
  const TIME_SCALE = 0.5;

  let W = 0, H = 0;

  const state = {
    t: 0,
    v: 0.8,
    tTurn: null,
    running: false,
    finished: false,
    rocketAngle: 0,
  };

  const gammaOf = v => 1 / Math.sqrt(1 - v * v);
  const turnTime = () => (state.tTurn !== null ? state.tTurn : D / state.v);

  function positionAt(t) {
    const tT = turnTime();
    if (t <= tT) return state.v * t;
    return state.v * (2 * tT - t);
  }

  const stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random(),
      y: Math.random(),
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.15,
      tw: Math.random() * Math.PI * 2,
      sp: 0.5 + Math.random() * 2,
    });
  }

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function drawEarth(x, y) {
    const d = I18N[currentLang];
    const r = 20;

    const glow = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 2.4);
    glow.addColorStop(0, 'rgba(70, 150, 255, 0.30)');
    glow.addColorStop(1, 'rgba(70, 150, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.4, 0, Math.PI * 2);
    ctx.fill();

    const g = ctx.createRadialGradient(x - 7, y - 7, 2, x, y, r);
    g.addColorStop(0, '#7ec0ff');
    g.addColorStop(0.5, '#2b7de0');
    g.addColorStop(1, '#0e3a75');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.fillStyle = 'rgba(70, 190, 130, 0.75)';
    ctx.beginPath();
    ctx.ellipse(x - 5, y - 5, 8, 5, 0.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + 6, y + 5, 5, 4, -0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x - 3, y + 8, 4, 3, 0.1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = '#6b7c94';
    ctx.font = '500 12px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.canvasEarth, x, y + r + 22);
  }

  function drawDestStar(x, y) {
    const d = I18N[currentLang];
    const glow = ctx.createRadialGradient(x, y, 0, x, y, 32);
    glow.addColorStop(0, 'rgba(255, 220, 120, 0.45)');
    glow.addColorStop(1, 'rgba(255, 220, 120, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(x, y, 32, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffe08a';
    ctx.beginPath();
    ctx.arc(x, y, 5.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#6b7c94';
    ctx.font = '500 11px -apple-system, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(d.canvasDest, x, y + 34);
  }

  function drawRocket(x, y, angle, time) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    const flick = 0.75 + 0.25 * Math.sin(time * 35);
    const fLen = 16 * flick;
    const fg = ctx.createLinearGradient(-11, 0, -11 - fLen, 0);
    fg.addColorStop(0, 'rgba(255, 230, 150, 1)');
    fg.addColorStop(0.4, 'rgba(255, 150, 50, 0.85)');
    fg.addColorStop(1, 'rgba(255, 70, 0, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath();
    ctx.moveTo(-11, -5);
    ctx.quadraticCurveTo(-11 - fLen * 0.6, -3, -11 - fLen, 0);
    ctx.quadraticCurveTo(-11 - fLen * 0.6, 3, -11, 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#d94f3d';
    ctx.beginPath();
    ctx.moveTo(-7, -7);
    ctx.lineTo(-17, -15);
    ctx.lineTo(-13, -7);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-7, 7);
    ctx.lineTo(-17, 15);
    ctx.lineTo(-13, 7);
    ctx.closePath();
    ctx.fill();

    const bg = ctx.createLinearGradient(0, -8, 0, 8);
    bg.addColorStop(0, '#ffffff');
    bg.addColorStop(0.45, '#dfe7f2');
    bg.addColorStop(1, '#95a5bb');
    ctx.fillStyle = bg;
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.quadraticCurveTo(14, -8, 4, -8);
    ctx.lineTo(-11, -8);
    ctx.lineTo(-11, 8);
    ctx.lineTo(4, 8);
    ctx.quadraticCurveTo(14, 8, 20, 0);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#e05a45';
    ctx.beginPath();
    ctx.moveTo(20, 0);
    ctx.quadraticCurveTo(14, -8, 5, -8);
    ctx.lineTo(5, 8);
    ctx.quadraticCurveTo(14, 8, 20, 0);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.arc(2, 0, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = '#4aa8ff';
    ctx.fill();
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.restore();
  }

  function draw(time) {
    ctx.clearRect(0, 0, W, H);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#060a12');
    bg.addColorStop(1, '#0b1524');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      const tw = 0.7 + 0.3 * Math.sin(time * s.sp + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    const margin = 72;
    const earthX = margin;
    const destX = W - margin;
    const cy = H * 0.52;

    ctx.strokeStyle = 'rgba(80, 130, 200, 0.14)';
    ctx.lineWidth = 1;
    ctx.setLineDash([3, 7]);
    ctx.beginPath();
    ctx.moveTo(earthX, cy);
    ctx.lineTo(destX, cy);
    ctx.stroke();
    ctx.setLineDash([]);

    drawDestStar(destX, cy);
    drawEarth(earthX, cy);

    const tT = turnTime();

    if (state.t >= tT) {
      const turnX = earthX + (state.v * tT / D) * (destX - earthX);
      ctx.strokeStyle = 'rgba(255, 190, 90, 0.35)';
      ctx.setLineDash([3, 5]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(turnX, cy - 46);
      ctx.lineTo(turnX, cy + 46);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    const pos = positionAt(state.t);
    const frac = Math.max(0, Math.min(1, pos / D));
    const rx = earthX + frac * (destX - earthX);

    if (rx > earthX + 1) {
      const pg = ctx.createLinearGradient(earthX, 0, rx, 0);
      pg.addColorStop(0, 'rgba(90, 160, 255, 0.05)');
      pg.addColorStop(1, 'rgba(90, 160, 255, 0.45)');
      ctx.strokeStyle = pg;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(earthX, cy);
      ctx.lineTo(rx, cy);
      ctx.stroke();
    }

    drawRocket(rx, cy, state.rocketAngle, time);
  }

  function updateUI() {
    const d = I18N[currentLang];
    const g = gammaOf(state.v);
    earthTimeEl.textContent = state.t.toFixed(2) + ' ' + d.unitsYears;
    rocketTimeEl.textContent = (state.t / g).toFixed(2) + ' ' + d.unitsYears;
    gammaEl.textContent = g.toFixed(3);
  }

  function updateButtons() {
    const d = I18N[currentLang];
    if (state.finished) {
      startBtn.disabled = true;
      startBtn.textContent = d.done;
      turnBtn.disabled = true;
      return;
    }
    startBtn.disabled = false;
    startBtn.textContent = state.running
      ? d.pause
      : (state.t > 0 ? d.resume : d.start);
    turnBtn.disabled = !(state.t > 0 && state.tTurn === null);
    speedInput.disabled = state.t > 0;
  }

  function onFinish() {
    const d = I18N[currentLang];
    const g = gammaOf(state.v);
    const diff = state.t - state.t / g;
    resultEl.textContent = d.resultMsg(diff);
    resultEl.classList.add('show');
  }

  let lastTime = 0;
  function loop(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    update(dt);
    draw(now / 1000);
    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (state.running && !state.finished) {
      state.t += dt / TIME_SCALE;
      const tEnd = 2 * turnTime();
      if (state.t >= tEnd) {
        state.t = tEnd;
        state.running = false;
        state.finished = true;
        updateButtons();
        onFinish();
      }
    }

    const tT = turnTime();
    const target = state.t >= tT ? Math.PI : 0;
    let diff = target - state.rocketAngle;
    while (diff > Math.PI) diff -= 2 * Math.PI;
    while (diff < -Math.PI) diff += 2 * Math.PI;
    state.rocketAngle += diff * Math.min(1, dt * 12);

    updateUI();
  }

  startBtn.addEventListener('click', () => {
    if (state.finished) return;
    state.running = !state.running;
    updateButtons();
  });

  turnBtn.addEventListener('click', () => {
    if (state.tTurn !== null || state.t <= 0 || state.finished) return;
    state.tTurn = state.t;
    updateButtons();
  });

  resetBtn.addEventListener('click', () => {
    state.t = 0;
    state.tTurn = null;
    state.running = false;
    state.finished = false;
    state.rocketAngle = 0;
    resultEl.classList.remove('show');
    resultEl.textContent = '';
    updateButtons();
    updateUI();
  });

  speedInput.addEventListener('input', () => {
    state.v = parseFloat(speedInput.value);
    vLabel.textContent = state.v.toFixed(2) + ' c';
    gammaEl.textContent = gammaOf(state.v).toFixed(3);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (!startBtn.disabled) startBtn.click();
    } else if (e.key === 'r' || e.key === 'R' || e.key === 'к' || e.key === 'К') {
      resetBtn.click();
    }
  });

  window.addEventListener('resize', resize);

  resize();
  applyLang(currentLang);
  updateButtons();
  updateUI();
  requestAnimationFrame((t) => {
    lastTime = t;
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
